<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cashfree Checkout</title>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d0d1a; color: #fff; }
  .wrap { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; padding: 24px; text-align: center; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(168,85,247,.2); border-top-color: #a855f7; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { margin-top: 24px; font-size: 16px; color: rgba(255,255,255,.85); }
  .err { color: #ef4444; }
  .ok { color: #22c55e; }
  .btn { margin-top: 24px; padding: 14px 28px; background: #a855f7; color: #fff; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div id="spinner" class="spinner"></div>
  <div id="msg" class="msg">Opening Cashfree checkout...</div>
</div>
<script>
  function getSessionId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('session_id') || window.location.hash.replace('#', '');
  }

  function setMsg(text, cls) {
    const m = document.getElementById('msg');
    m.textContent = text;
    m.className = 'msg' + (cls ? ' ' + cls : '');
    document.getElementById('spinner').style.display = 'none';
  }

  async function start() {
    const sessionId = getSessionId();
    if (!sessionId) {
      setMsg('Missing payment session. Please go back and try again.', 'err');
      return;
    }

    try {
      const cashfree = Cashfree({ mode: 'production' });
      const result = await cashfree.checkout({
        paymentSessionId: sessionId,
        redirectTarget: '_self',
      });
      if (result.error) {
        setMsg('Payment failed: ' + (result.error.message || 'Unknown error'), 'err');
      } else if (result.paymentDetails) {
        setMsg('Payment successful! You can return to the app.', 'ok');
      }
    } catch (e) {
      setMsg('Could not load checkout: ' + e.message, 'err');
    }
  }

  start();
</script>
</body>
</html>
